<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #070e22;
      color: white;
      overflow: hidden;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 700px;
      animation: fadeIn 1s ease-in-out;
    }

    .error-code {
      font-size: 9rem;
      font-weight: 700;
      color: #8b03fa;
      text-shadow: 0 0 20px rgba(139, 3, 250, 0.5);
      line-height: 1;
    }

    .title {
      font-size: 2rem;
      margin-top: 10px;
      font-weight: 600;
    }

    .description {
      margin-top: 15px;
      color: #cbd5e1;
      font-size: 1rem;
      line-height: 1.7;
    }

    .btn-group {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 500;
      transition: 0.3s ease;
      display: inline-block;
    }

    .primary-btn {
      background: #38bdf8;
      color: #0f172a;
    }

    .primary-btn:hover {
      background: #0ea5e9;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
    }

    .secondary-btn {
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }

    .secondary-btn:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-3px);
    }

    .floating-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.08);
      animation: float 8s infinite ease-in-out;
    }

    .circle1 {
      width: 250px;
      height: 250px;
      top: -60px;
      left: -60px;
    }

    .circle2 {
      width: 180px;
      height: 180px;
      bottom: -50px;
      right: -50px;
      animation-delay: 2s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(20px);
      }
    }

    @media (max-width: 768px) {
      .error-code {
        font-size: 6rem;
      }

      .title {
        font-size: 1.5rem;
      }

      .description {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="floating-circle circle1"></div>
  <div class="floating-circle circle2"></div>

  <div class="container">
    <div class="error-code">404</div>
    <h1 class="title">Oops! Page Not Found</h1>
    <p class="description">
      The page you are looking for might have been removed, renamed, or is temporarily unavailable.<br />
      <br />Please visit again - the developer will make the website live soon.
    </p>
  </div>
</body>
</html>
